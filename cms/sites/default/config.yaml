site:
    allowed_content_types: ['page', 'article']
    locales: ['en', 'es']
    default_locale: 'en'
    https_redirect: true
    hosts:
        - { domain: '127.0.0.1', port: 8000, canonical: true }
        - { domain: 'localhost', port: 8000, redirect_to_canonical: true }

    paths:
        - { path: '/en', locale: 'en' }
        - { path: '/es', locale: 'es' }

    slash_route:
        behaviour: 'redirect_to_route_with_user_language'
        route: 'home'
        redirect_code: 301

    robots:
        mode: static

    sitemaps:
        default:
            url: sitemap.xml
            cache_ttl: 300
            default_priority: "1.0"
            default_changefreq: "weekly"
            alternates_include_hreflang: false

    sitemaps_index:
        url: sitemap-index.xml
        cache_ttl: 300
